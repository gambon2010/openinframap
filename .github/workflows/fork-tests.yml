# Fork: the fork's three test suites and their linters, on every push and pull
# request (upstream's workflows only build upstream's images). Nothing here needs
# Docker, the database or the network beyond installing packages: the scripts'
# tests use fake docker/curl (scripts/tests/fakes/), the backend's skip what needs
# a real database.
name: Fork tests

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint (the fork's files)
        run: npx eslint src/fork && npx prettier --check "src/fork/**/*.ts"
      - name: Types
        # Upstream's own files have type errors of their own: only the fork's must be clean.
        run: |
          npx tsc --noEmit -p . | tee tsc.log || true
          ! grep "src/fork/" tsc.log
      - run: npm run test:fork

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: "0.6.2"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check src/fork tests/fork
      - run: uv run mypy .
      - run: uv run pytest tests/fork

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: "0.6.2"
      - run: uvx ruff check scripts
      - run: uvx ruff format --check scripts
      - name: Shell
        run: uvx --from shellcheck-py shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh scripts/build/*.sh
      - run: uv run --with pytest --with httpx --with psycopg2-binary pytest scripts/tests

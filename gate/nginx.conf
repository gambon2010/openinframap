# Fork: the gate (docs/plans/sync.md, "Login for the whole app"): the one entry
# point from the network, on port 8800. Every request needs a logged-in session:
# nginx asks the backend (/auth/check, with the request's cookie) before passing it
# on; without one, a page goes to the login page. Runs on the host's network
# (docker-compose.override.yml), so it reaches the other services on 127.0.0.1,
# where they only listen.
#
#   /                 the frontend (the Vite dev server, npm start, port 5173)
#   /tegola/...       the map tiles (Tegola, 7800)
#   /basemap/...      the background map and imagery (pmtiles, 8090)
#   /login, /auth/... logging in (the backend, open)
#   backend paths     the backend (8001), which checks the session itself too

worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_types application/vnd.mapbox-vector-tile application/x-protobuf application/json application/javascript text/css;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend { server 127.0.0.1:8001; }
    upstream tegola { server 127.0.0.1:7800; }
    upstream basemap { server 127.0.0.1:8090; }
    # The dev server listens on localhost, which can be IPv6 only (::1).
    upstream frontend {
        server 127.0.0.1:5173;
        server [::1]:5173;
    }

    server {
        listen 8800;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Is this request's session valid? (204 or 401)
        location = /_auth {
            internal;
            proxy_pass http://backend/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        # Without a session: pages go to the login page, coming back here after.
        location @login {
            return 302 /login?next=$request_uri;
        }

        # Logging in: open.
        location = /login {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
        location /auth/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /tegola/ {
            auth_request /_auth;
            proxy_pass http://tegola/;
            proxy_set_header Host $host;
        }

        location /basemap/ {
            auth_request /_auth;
            proxy_pass http://basemap/;
            proxy_set_header Host $host;
        }

        # The backend (it answers 401 itself without a session).
        location ~ ^/(userdata|api|grid|search|stats|about|copyright|static|local-images|wikidata|sitemap\.xml|heatmap\.json)(/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            # Live updates (Server-Sent Events) stream without buffering.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # The frontend; its dev server only answers to its own host name, and its
        # live reload needs the WebSocket upgrade.
        location / {
            auth_request /_auth;
            error_page 401 = @login;
            proxy_pass http://frontend;
            proxy_set_header Host localhost:5173;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}

# Fork: the gate (docs/plans/archive/sync.md, "Login for the whole app"): the one entry
# point from the network, https on port 8800 (its own certificate,
# 10-certificate.sh; plain http there is sent to https). Every request needs a logged-in session:
# nginx asks the backend (/auth/check, with the request's cookie) before passing it
# on; without one, a page goes to the login page. On Compose's network (Docker
# Desktop on Windows has no host network by default), reaching the services by
# name; they only listen on this computer. Development opens Vite's dev server
# instead (http://localhost:5173, web/vite.config.ts passes it these same paths).
#
#   /                 the page, built into the image (gate/Dockerfile)
#   /tegola/...       the map tiles (Tegola)
#   /background/...   the background map (the backend, from every area's file)
#   /terrain/...      the terrain's elevation tiles (the backend, from every area's file)
#   /imagery, /satellite/...  the satellite imagery (the backend: its list, its tiles)
#   /login, /auth/... logging in (the backend, open)
#   backend paths     the backend, which checks the session itself too

worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    gzip on;
    gzip_proxied any;
    gzip_types application/vnd.mapbox-vector-tile application/x-protobuf application/json application/javascript text/css;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The services by their names, on the ports they listen on inside their
    # containers, through Docker's DNS (127.0.0.11), asked again as containers are
    # recreated (`resolve`, nginx 1.27.3+; the shared zone it needs).
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend {
        zone backend 64k;
        server backend:80 resolve;
    }
    upstream tegola {
        zone tegola 64k;
        server tegola:80 resolve;
    }

    server {
        listen 8800 ssl;
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Plain http to this port: to https.
        error_page 497 =301 https://$host:$server_port$request_uri;

        # (A location that sets a header of its own loses these: it repeats them.)
        # $http_host keeps the port (:8800): the backend's redirects need it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Is this request's session valid? (204 or 401)
        location = /_auth {
            internal;
            proxy_pass http://backend/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Without a session: pages go to the login page, coming back here after.
        location @login {
            return 302 /login?next=$request_uri;
        }

        # Logging in: open.
        location = /login {
            proxy_pass http://backend;
        }
        location /auth/ {
            proxy_pass http://backend;
        }

        location /tegola/ {
            auth_request /_auth;
            proxy_pass http://tegola/;
        }

        # The backend (it answers 401 itself without a session).
        location ~ ^/(userdata|api|grid|background|terrain|imagery|satellite|search|stats|about|copyright|static|local-images|wikidata|sitemap\.xml|heatmap\.json)(/|$) {
            proxy_pass http://backend;
            # Live updates (Server-Sent Events) stream without buffering.
            proxy_buffering off;
            proxy_read_timeout 1h;
        }

        # The map's service worker would answer page visits without the gate
        # (service-worker/sw.js says why): never installed, and removed from a
        # browser that has it. Open: it's fetched without asking the user.
        location = /sw.js {
            root /etc/nginx/service-worker;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }
        location = /registerSW.js {
            default_type application/javascript;
            return 200 "";
        }

        # The page, built into the image. The assets' names change with their
        # content: kept a year; the page itself is asked again each time, so a new
        # build shows at once.
        root /usr/share/nginx/html;
        location / {
            auth_request /_auth;
            error_page 401 = @login;
            index index.html;
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            auth_request /_auth;
            error_page 401 = @login;
            expires 365d;
        }
    }
}

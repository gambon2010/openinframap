# Fork: the page built into the gate's image (gate/Dockerfile's `built`). The
# assets' names change with their content: kept a year; the page itself is asked
# again each time, so a new build shows at once.
root /usr/share/nginx/html;

location / {
    auth_request /_auth;
    error_page 401 = @login;
    index index.html;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    auth_request /_auth;
    error_page 401 = @login;
    expires 365d;
}

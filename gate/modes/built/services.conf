# Fork: the built gate runs on Compose's network (docker-compose.override.yml): Docker
# Desktop (Windows) has no host network by default. It reaches the services by
# their names, on the ports they listen on inside their containers, through
# Docker's DNS (127.0.0.11), asked again as containers are recreated (`resolve`,
# nginx 1.27.3+; the shared zone it needs).
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend {
    zone backend 64k;
    server backend:80 resolve;
}
upstream tegola {
    zone tegola 64k;
    server tegola:80 resolve;
}

# Fork: the development gate runs on the host's network (docker-compose.override.yml),
# where the services listen on 127.0.0.1 and Vite's dev server (npm start) on
# localhost: Vite stays on localhost, out of the network's reach.
upstream backend { server 127.0.0.1:8001; }
upstream tegola { server 127.0.0.1:7800; }
# Vite's dev server (page.conf); localhost can be IPv6 only (::1).
upstream frontend {
    server 127.0.0.1:5173;
    server [::1]:5173;
}

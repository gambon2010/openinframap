# Fork: the fork's changes to docker-compose.yml (left as upstream has it).
# Docker Compose merges this file with docker-compose.yml automatically.

services:
  db:
    # The database port on the host, for the web-backend when it runs outside
    # Docker (uvicorn): postgresql://osm:osm@localhost:5432/osm.
    # This computer only: from the network, everything goes through the gate.
    ports:
      - "127.0.0.1:5432:5432"
    # :z labels the mounts for SELinux (Fedora); same container paths, so these
    # replace upstream's.
    volumes:
      - ./schema/dev-init.sql:/docker-entrypoint-initdb.d/90-dev-init.sql:z
      - ./schema/functions.sql:/docker-entrypoint-initdb.d/91-functions.sql:z

  tegola:
    # 7800 rather than upstream's 8080 (often taken); !override replaces the list.
    ports: !override
      - "127.0.0.1:7800:80"

  # Web backend (stats pages, search, Wikidata popups). The image has its own
  # Python and packages, so it also runs on a computer without internet once
  # the image is loaded (scripts/export-db.sh saves it). For development with
  # auto-reload you can still run it on the host instead (see web-backend/).
  backend:
    build: web-backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://osm:osm@db:5432/osm"
    # Run the venv built into the image directly: `uv run` would try to sync
    # (and download) packages at startup.
    entrypoint: ["/app/.venv/bin/uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      # Offline Wikidata cache filled by scripts/fetch_images.py on the host.
      - ./data/images:/data/images:z
      - ./data/wikidata_json:/data/wikidata_json:z
    depends_on:
      - db

  # Offline background map: serves data/basemap/<region>.pmtiles (Protomaps
  # extracts made by scripts/build-region.sh) at
  # http://localhost:8090/<region>/{z}/{x}/{y}.mvt. Also used to cut extracts.
  basemap:
    image: protomaps/go-pmtiles:v1.28.0
    # --public-url: its TileJSON (/<name>.json) then answers, with each file's bounds
    # (the frontend greys out satellite imagery where there's none).
    command: ["serve", "/data", "--cors=*", "--public-url=https://localhost:8800/basemap"]
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./data/basemap:/data:ro,z

  # The gate (gate/nginx.conf): the one entry point, https://<this computer>:8800.
  # Every request needs a logged-in session (docs/plans/sync.md); the other
  # services above only listen on this computer. On the host's network, to reach
  # them and the frontend dev server (npm start) on 127.0.0.1.
  gate:
    build: gate
    network_mode: host
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro,z
      # Its HTTPS certificate, made on first start (gate/10-certificate.sh).
      - ./data/gate:/etc/nginx/certs:z
    restart: unless-stopped

  # Helper image for scripts/build-region.sh. Not started by `docker compose up`.
  osmium:
    build: tools/osmium
    profiles: [tools]
